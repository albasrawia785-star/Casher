name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (مهمة جداً لأندرويد)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. فك ضغط الملف المضغوط
      - name: Unzip project files
        run: unzip *.zip -d project_dir

      # 4. الانتقال للمجلد وتوليد ملف gradlew المفقود وبناء المشروع
      - name: Generate Gradle Wrapper and Build APK
        run: |
          # البحث التلقائي عن المجلد المفرغ الذي يحتوي على ملف settings.gradle.kts
          TARGET_DIR=$(find project_dir -name "settings.gradle.kts" -exec dirname {} \;)
          
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ خطأ: لم يتم العثور على ملفات مشروع أندرويد!"
            exit 1
          fi
          
          echo "📂 تم العثور على المجلد الصحيح: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          echo "🛠️ توليد ملفات gradlew المفقودة..."
          gradle wrapper
          
          echo "🔑 إعطاء صلاحيات التشغيل..."
          chmod +x gradlew
          
          echo "🚀 بدء بناء الـ APK..."
          ./gradlew assembleDebug

      # 5. رفع ملف الـ APK الناتج لكي تقوم بتحميله من الـ Actions
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: project_dir/**/build/outputs/apk/debug/*.apk
