name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (مهمة جداً لأندرويد)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. فك ضغط أي ملف zip مهما كان اسمه داخل مجلد project_dir
      - name: Unzip project files
        run: unzip *.zip -d project_dir

      # 4. إعداد أداة Gradle وإعطاء صلاحية التشغيل للملف المسؤول عن البناء
      - name: Grant execute permission for gradlew
        run: |
          cd project_dir
          chmod +x gradlew

      # 5. أمر بناء الـ APK (سيقوم ببناء نسخة الـ Debug)
      - name: Build APK with Gradle
        run: |
          cd project_dir
          ./gradlew assembleDebug

      # 6. خطوة اختيارية (لحفظ ملف الـ APK المكتمل حتى تستطيع تحميله من المتصفح)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: project_dir/app/build/outputs/apk/debug/app-debug.pdf # أو امتداد .apk حسب إعدادات مشروعك
