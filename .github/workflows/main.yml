name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (مهمة جداً لأندرويد)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. فك ضغط الملف المضغوط
      - name: Unzip project files
        run: unzip *.zip -d project_dir

      # 4. إصلاح الملفات المفقودة وتشغيل البناء بالوضع الصامت
      - name: Fix Missing Files and Build APK
        env:
          # حل مشكلة الـ KSP و AWT-EventQueue بإجبار الجافا على الوضع الصامت
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
        run: |
          # البحث عن مجلد المشروع
          TARGET_DIR=$(find project_dir -name "settings.gradle.kts" -exec dirname {} \;)
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ خطأ: لم يتم العثور على ملفات مشروع أندرويد!"
            exit 1
          fi
          cd "$TARGET_DIR"
          
          echo "🛠️ توليد ملفات gradlew..."
          gradle wrapper
          chmod +x gradlew
          
          echo "🔑 توليد ملف debug.keystore وهمي لتخطي خطأ التوقيع..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          echo "📄 توليد ملف google-services.json وهمي لتخطي الفحص..."
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info": {"project_number": "123", "project_id": "mock"}, "client": [{"client_info": {"mobilesdk_app_id": "1:123:android:123", "android_client_info": {"package_name": "com.example.mock"}}, "api_key": [{"current_key": "mock"}]}]}' > app/google-services.json
          fi

          echo "🚀 بدء بناء الـ APK..."
          ./gradlew assembleDebug --no-daemon

      # 5. رفع ملف الـ APK الناتج لكي تقوم بتحميله
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: project_dir/**/build/outputs/apk/debug/*.apk
